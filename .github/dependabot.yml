version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /images/node
      - /images/go
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    ignore:
      # Node 只跟当前长期支持版，换大版本时改这里
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directories:
      - /services/*
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    ignore:
      # MySQL 的 26.x、MariaDB 的 13.x 是滚动发布线，服务只跟官方 lts 标签对应的大版本
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3

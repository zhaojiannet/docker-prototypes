name: images

on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/images.yml]
  pull_request:
    paths: [images/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 标签从 Dockerfile 里算出来，版本号只写在 Dockerfile 一处
      - name: 算标签
        id: tags
        run: |
          node_ver=$(sed -nE 's/^FROM node:([0-9.]+)-.*/\1/p' images/node/Dockerfile)
          pnpm_ver=$(sed -nE 's/^ARG PNPM_VERSION=([0-9.]+).*/\1/p' images/node/Dockerfile)
          go_ver=$(sed -nE 's/^FROM golang:([0-9.]+)-.*/\1/p' images/go/Dockerfile)
          test -n "$node_ver" && test -n "$pnpm_ver" && test -n "$go_ver"
          echo "node=${node_ver}-pnpm${pnpm_ver}" >> "$GITHUB_OUTPUT"
          echo "go=${go_ver}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 先只构建本机架构并载入，跑测试和漏洞扫描；通过了再构建双架构推送
      - name: 构建 node（测试用）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/node/Dockerfile
          load: true
          tags: dev-node:test
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max

      - name: 构建 go（测试用）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/go/Dockerfile
          load: true
          tags: dev-go:test
          cache-from: type=gha,scope=go
          cache-to: type=gha,scope=go,mode=max

      - name: 冒烟测试
        run: images/test.sh dev-node:test dev-go:test

      - name: 扫描 node
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dev-node:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: 扫描 go
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dev-go:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 已推过的标签不覆写：同一标签拉到的内容必须一样
      - name: 查标签是否已推过
        if: github.event_name != 'pull_request'
        id: exists
        run: |
          check() { docker buildx imagetools inspect "$1" >/dev/null 2>&1 && echo true || echo false; }
          echo "node=$(check "${REGISTRY}/dev-node:${{ steps.tags.outputs.node }}")" >> "$GITHUB_OUTPUT"
          echo "go=$(check "${REGISTRY}/dev-go:${{ steps.tags.outputs.go }}")" >> "$GITHUB_OUTPUT"

      - name: 登录 ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送 node
        if: github.event_name != 'pull_request' && steps.exists.outputs.node == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/dev-node:${{ steps.tags.outputs.node }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=node

      - name: 推送 go
        if: github.event_name != 'pull_request' && steps.exists.outputs.go == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/dev-go:${{ steps.tags.outputs.go }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=go

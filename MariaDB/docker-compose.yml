services:
  mariadb:
    image: mariadb:12.3.3
    container_name: mariadb-server
    user: "1000:1000"
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?请先在 .env 里设置}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-default_db}
      MARIADB_USER: ${MARIADB_USER:-admin}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?请先在 .env 里设置}

    # 只绑本机：不加 127.0.0.1 会监听 0.0.0.0，同网段任何机器都能连进来。
    # 容器之间走 docker-net 用服务名互连，不经过这里的端口映射，不受影响。
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"

    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./conf:/etc/mysql/conf.d:ro
      - ./backups:/backups

    # 镜像自带的健康检查脚本，比 ping 更严格，会确认 InnoDB 初始化完成
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - docker-net

networks:
  docker-net:
    external: true
    name: docker-net

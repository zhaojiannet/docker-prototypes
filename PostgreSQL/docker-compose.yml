services:
  postgres:
    image: postgres:18.6
    container_name: postgres-server
    user: "1000:1000"
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 里设置}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      LANG: C.UTF-8
      # PG18 的数据目录换了层级，显式指定避免用错
      PGDATA: /var/lib/postgresql/18/docker

    # 只绑本机：不加 127.0.0.1 会监听 0.0.0.0，同网段任何机器都能连进来。
    # 容器之间走 docker-net 用服务名互连，不经过这里的端口映射，不受影响。
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups

    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - docker-net

networks:
  docker-net:
    external: true
    name: docker-net

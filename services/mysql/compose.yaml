services:
  mysql:
    image: mysql:26.7.0@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 里设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-default_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 里设置}

    # 只绑本机：不加 127.0.0.1 会监听 0.0.0.0，同网段任何机器都能连进来。
    # 容器之间走 dev-net 用服务名互连，不经过这里的端口映射，不受影响。
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

    volumes:
      - data:/var/lib/mysql
      - ./conf:/etc/mysql/conf.d:ro
      - ./backups:/backups

    healthcheck:
      # 不带认证：连得上就说明服务活着，mysqladmin 此时返回 Access denied 但退出码是 0。
      # 带 -p 会让密码明文出现在 docker inspect 的容器元数据里。
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dev-net

volumes:
  data:

networks:
  # 和项目模板同名，先起的建、后起的加入
  dev-net:
    name: dev-net

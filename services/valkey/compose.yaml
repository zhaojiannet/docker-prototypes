services:
  valkey:
    image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    # 一台机器只跑一个，容器名固定成服务名：连库的主机名、docker exec、看日志都用同一个名字
    container_name: valkey
    restart: unless-stopped
    # 入口脚本只在第一个参数是 valkey-server 时才降权，下面的 command 以 sh 开头，
    # 不在这里指定用户的话进程和 /data 下的文件都会是 root 的
    user: valkey

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      # 必须传进容器，下面 command 和 healthcheck 都要用它
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?请先在 .env 里设置}

    # 只绑本机：不加 127.0.0.1 会监听 0.0.0.0，同网段任何机器都能连进来。
    # 容器之间走 docker-net 用服务名互连，不经过这里的端口映射，不受影响。
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

    volumes:
      - data:/data
      - ./conf/valkey.conf:/etc/valkey/valkey.conf:ro

    # 密码从环境变量取，不写进配置文件，避免明文密码进版本库
    command: ["sh", "-c", "exec valkey-server /etc/valkey/valkey.conf --requirepass \"$$VALKEY_PASSWORD\""]

    healthcheck:
      # 必须带密码，否则设了 requirepass 之后 ping 会返回 NOAUTH
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - docker-net

volumes:
  # external：compose 不建也不删这个卷，`down -v` 删不到数据；第一次 up 之前先 `docker volume create valkey-data`
  data:
    external: true
    name: valkey-data

networks:
  # 所有项目和数据库共用。external：compose 不建也不删，第一次用前先 `docker network create docker-net`
  docker-net:
    external: true
    name: docker-net

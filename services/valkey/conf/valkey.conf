# Valkey 自定义配置
# 密码不写在这里，由 docker-compose 用 --requirepass 从 .env 传进来

bind 0.0.0.0
port 6379
protected-mode yes

# ---- 持久化：AOF 和 RDB 两个都开 ----
# AOF 记每一条写命令，恢复时数据丢得最少
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# 每秒刷一次盘。改成 always 更安全但慢很多，改成 no 最快但断电可能丢一秒以上
appendfsync everysec

# RDB 快照，作为 AOF 之外的第二份保险
# 900 秒内有 1 次写、300 秒内有 10 次、60 秒内有 10000 次，就存一次快照
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ---- 内存 ----
# 开发机上限给 512MB，满了按最近最少使用淘汰
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---- 日志 ----
loglevel notice

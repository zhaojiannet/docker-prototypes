name: image

on:
  push:
    branches: [main]
  schedule:
    # 每周一 09:00（Asia/Tokyo）重建 main 的最新提交：基础镜像出了补丁，同一个提交号的镜像换成新构建，
    # 服务器上 dp patch 拉到的就是它。服务器跑的不是 main 最新提交时拿不到，要先 dp deploy
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr 的镜像名只认小写，仓库名带大写字母时直接用会被拒
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # 定时重建不用缓存：要的就是重新拉基础镜像、重新装系统包
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

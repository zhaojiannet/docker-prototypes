services:
  app:
    build:
      context: .
      # 只在基础镜像上改用户的 uid、gid，让容器里写出的文件和宿主机用户同属主。
      # Linux 上 uid 不是 1000 时在 .env 里写 PUID、PGID；Mac 上不用管。
      dockerfile_inline: |
        FROM ghcr.io/zhaojiannet/golang:1.27.1-trixie-dev
        ARG PUID
        ARG PGID
        USER root
        RUN fix-user "$$PUID" "$$PGID"
        USER go
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    # OrbStack 下用 https://<项目名>.orb.local 访问，不占宿主机端口。
    # 要 localhost 加端口时在 .env 里启用 COMPOSE_FILE，合并 compose.ports.yaml
    labels:
      - dev.orbstack.domains=${COMPOSE_PROJECT_NAME}.orb.local
      - dev.orbstack.http-port=8080
    volumes:
      - ./app:/app
      - go-mod:/go/pkg/mod
      - go-build:/go/cache
    networks:
      - docker-net

volumes:
  # 所有 Go 项目共用：模块只下载一次，编译缓存跨项目命中
  go-mod:
    name: go-mod
  go-build:
    name: go-build

networks:
  # 所有项目和数据库共用。external：compose 不建也不删，第一次用前先 `docker network create docker-net`
  docker-net:
    external: true
    name: docker-net

services:
  app:
    build:
      context: .
      target: dev
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    # OrbStack 下用 https://<项目名>.orb.local 访问，不占宿主机端口。
    # 要 localhost 加端口时在 .env 里启用 COMPOSE_FILE，合并 compose.ports.yaml
    labels:
      - dev.orbstack.domains=${COMPOSE_PROJECT_NAME}.orb.local
      - dev.orbstack.http-port=8080
    volumes:
      - ./app:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    networks:
      - docker-net

volumes:
  # 所有 Go 项目共用：模块只下载一次，编译缓存跨项目命中
  go-mod:
    name: go-mod
  go-build:
    name: go-build

networks:
  # 所有项目和数据库共用。external：compose 不建也不删，dp 第一次用时会建好
  docker-net:
    external: true
    name: docker-net

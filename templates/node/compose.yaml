services:
  app:
    build:
      context: .
      # 只在基础镜像上改用户的 uid、gid，让容器里写出的文件和宿主机用户同属主。
      # Linux 上 uid 不是 1000 时在 .env 里写 PUID、PGID；Mac 上不用管。
      dockerfile_inline: |
        FROM ghcr.io/zhaojiannet/node:24.21.0-trixie-dev@sha256:dd38904916ed156cb3df11c3f0486bb5719e03b530d6c1483b5884cf94592927
        ARG PUID
        ARG PGID
        USER root
        RUN fix-user "$$PUID" "$$PGID"
        USER node
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      # Vite 默认只放行 localhost 和 IP，用 OrbStack 域名访问会返回 403
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .orb.local
    # OrbStack 下用 https://<项目名>.orb.local 访问，不占宿主机端口。
    # 要 localhost 加端口时在 .env 里启用 COMPOSE_FILE，合并 compose.ports.yaml
    labels:
      - dev.orbstack.domains=${COMPOSE_PROJECT_NAME}.orb.local
      - dev.orbstack.http-port=4321
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
      - pnpm:/home/node/.local/share/pnpm
    networks:
      - docker-net

volumes:
  node_modules:
  # 所有 Node 项目共用，包只下载一次
  pnpm:
    name: pnpm

networks:
  # 所有项目和数据库共用。external：compose 不建也不删，第一次用前先 `docker network create docker-net`
  docker-net:
    external: true
    name: docker-net
